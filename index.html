<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGBOOLA ENOCH ADURAGBEMI - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>BOBO</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <section id="about">
        <h2>About Me</h2>
        <p>
            Just a nice guy .
        </p>
    </section>
    <section id="projects">
        <h2>Projects</h2>
        <div class="project-list">
            <div class="project">
                <h3>Project One</h3>
                <p>Description of your first project.</p>
            </div>
            <div class="project">
                <h3>Project Two</h3>
                <p>Description of your second project.</p>
            </div>
        </div>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <form id="contactForm">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <label for="message">Message:</label>
            <textarea id="message" required></textarea>
            <button type="submit">Send</button>
            <p id="formResult"></p>
        </form>
    </section>
    <footer>
        <p>&copy; 2025 AGBOOLA ENOCH. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
 <style type="text/css">
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #08015c;
    color: #222;
}

header {
    background: #222;
    color: #fff;
    padding: 20px 0;
    text-align: center;
}

nav a {
    color: #fff;
    margin: 0 15px;
    text-decoration: none;
}

nav a:hover {
    text-decoration: underline;
}

section {
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

h2 {
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.project-list {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.project {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 5px;
    flex: 1 1 300px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input, textarea {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
}

button {
    padding: 10px 15px;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

footer {
    text-align: center;
    padding: 20px 0;
    background: #222;
    color: #fff;
    margin-top: 40px;
}
</style>
<script type="text/javascript">
document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('formResult').textContent = "Thank you for your message!";
    this.reset();
});
</script>
